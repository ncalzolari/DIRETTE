<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dirette TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<style>
/* Layout: a wall of channel keys in remote-control order, each showing its digital-terrestrial number, readable from the sofa. Single dark look, made for a TV screen. */
:root {
  color-scheme: dark;
  --bg: #0d1420;
  --panel: #18222f;
  --panel-edge: #2a3a4d;
  --fg: #eef3f8;
  --muted: #93a4b8;
  --focus: #ffc93c;
  --focus-ink: #14110a;
  --font: "Archivo", "Segoe UI", Roboto, Arial, sans-serif;
}
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  padding-block: clamp(16px, 3vh, 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: clamp(14px, 2.5vh, 28px);
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 24px;
}
h1 {
  margin: 0;
  font-size: clamp(26px, 3.2vw, 50px);
  font-weight: 800;
  font-stretch: 115%;
  letter-spacing: -0.01em;
}
.hint {
  margin: 0;
  color: var(--muted);
  font-size: clamp(14px, 1.4vw, 22px);
}
.hint b { color: var(--fg); font-weight: 600; }
.typed {
  display: inline-block;
  min-width: 2.2em;
  margin-left: .6em;
  padding: 0 .4em;
  border: 2px solid var(--panel-edge);
  border-radius: 6px;
  color: var(--focus);
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.wall {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: clamp(8px, 1vw, 18px);
}
.key {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 2px;
  min-width: 0;
  min-height: clamp(84px, 9vw, 150px);
  padding: clamp(10px, 1.1vw, 20px);
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  border-radius: 10px;
  color: var(--fg);
  text-decoration: none;
  outline: none;
  scroll-margin: 40px;
  transition: transform .12s ease, background-color .12s ease;
}
.key .num {
  position: absolute;
  top: clamp(6px, .8vw, 14px);
  right: clamp(10px, 1.1vw, 20px);
  font-size: clamp(26px, 3.2vw, 58px);
  font-weight: 800;
  font-stretch: 75%;
  line-height: 1;
  color: var(--panel-edge);
  font-variant-numeric: tabular-nums;
}
.key .name {
  font-size: clamp(17px, 1.7vw, 30px);
  font-weight: 700;
  line-height: 1.08;
  overflow-wrap: anywhere;
}
.key .via {
  font-size: clamp(12px, .95vw, 17px);
  color: var(--muted);
}
.key:hover { background: #1f2c3c; }
.key:focus, .key:focus-visible {
  background: var(--focus);
  border-color: var(--focus);
  color: var(--focus-ink);
  transform: scale(1.05);
  z-index: 1;
}
.key:focus .num, .key:focus .via { color: var(--focus-ink); opacity: .7; }
@media (max-width: 1000px) { .wall { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 700px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { .key { transition: none; } .key:focus { transform: none; } }
</style>
</head>
<body>

<header>
  <h1>Dirette TV</h1>
  <p class="hint">Digita il <b>numero del canale</b> o usa le <b>frecce</b>, poi premi <b>OK</b><span class="typed" id="typed" aria-live="polite">&nbsp;</span></p>
</header>

<nav class="wall" id="wall" aria-label="Canali in diretta"></nav>

<script>
(function () {
  var RAI = 'https://www.raiplay.it/dirette/';
  var MED = 'https://mediasetinfinity.mediaset.it/diretta/';
  // [numero sul telecomando, nome, servizio, indirizzo]
  var channels = [
    [1,  'Rai 1',          'RaiPlay',           RAI + 'rai1'],
    [2,  'Rai 2',          'RaiPlay',           RAI + 'rai2'],
    [3,  'Rai 3',          'RaiPlay',           RAI + 'rai3'],
    [4,  'Rete 4',         'Mediaset Infinity', MED + 'rete4_cR4'],
    [5,  'Canale 5',       'Mediaset Infinity', MED + 'canale5_cC5'],
    [6,  'Italia 1',       'Mediaset Infinity', MED + 'italia1_cI1'],
    [7,  'La7',            'la7.it',            'https://www.la7.it/dirette-tv'],
    [8,  'TV8',            'tv8.it',            'https://www.tv8.it/streaming'],
    [20, '20',             'Mediaset Infinity', MED + '20mediaset_cLB'],
    [21, 'Rai 4',          'RaiPlay',           RAI + 'rai4'],
    [22, 'Iris',           'Mediaset Infinity', MED + 'iris_cKI'],
    [23, 'Rai 5',          'RaiPlay',           RAI + 'rai5'],
    [24, 'Rai Movie',      'RaiPlay',           RAI + 'raimovie'],
    [25, 'Rai Premium',    'RaiPlay',           RAI + 'raipremium'],
    [27, '27 Twentyseven', 'Mediaset Infinity', MED + '27twentyseven_cTS'],
    [29, 'La7 Cinema',     'la7.it',            'https://www.la7.it/live-la7d'],
    [30, 'La5',            'Mediaset Infinity', MED + 'la5_cKA'],
    [34, 'Cine34',         'Mediaset Infinity', MED + 'cine34_cB6'],
    [35, 'Focus',          'Mediaset Infinity', MED + 'focus_cFU'],
    [39, 'Top Crime',      'Mediaset Infinity', MED + 'topcrime_cLT'],
    [40, 'Boing',          'Mediaset Infinity', MED + 'boing_cKB'],
    [42, 'Rai Gulp',       'RaiPlay',           RAI + 'raigulp'],
    [43, 'Rai Yoyo',       'RaiPlay',           RAI + 'raiyoyo'],
    [46, 'Cartoonito',     'Mediaset Infinity', MED + 'cartoonito_cLA'],
    [48, 'Rai News 24',    'RaiPlay',           RAI + 'rainews24'],
    [49, 'Italia 2',       'Mediaset Infinity', MED + 'italia2_cI2'],
    [51, 'TGCOM24',        'Mediaset Infinity', MED + 'video_cKF'],
    [54, 'Rai Storia',     'RaiPlay',           RAI + 'raistoria'],
    [55, 'Mediaset Extra', 'Mediaset Infinity', MED + 'mediasetextra_cKQ'],
    [57, 'Rai Scuola',     'RaiPlay',           RAI + 'raiscuola'],
    [58, 'Rai Sport',      'RaiPlay',           RAI + 'raisport']
  ];

  var wall = document.getElementById('wall');
  var typed = document.getElementById('typed');
  var keys = [], byNum = {};
  function span(cls, text) {
    var s = document.createElement('span');
    s.className = cls;
    s.appendChild(document.createTextNode(text));
    return s;
  }
  for (var j = 0; j < channels.length; j++) {
    var c = channels[j], a = document.createElement('a');
    a.className = 'key';
    a.id = 'ch' + c[0];
    a.href = c[3];
    a.rel = 'noopener';
    a.appendChild(span('num', String(c[0])));
    a.appendChild(span('name', c[1]));
    a.appendChild(span('via', 'su ' + c[2]));
    wall.appendChild(a);
    keys.push(a);
    byNum[c[0]] = a;
  }

  function cols() {
    return getComputedStyle(wall).gridTemplateColumns.split(' ').length;
  }
  function current() {
    var i = keys.indexOf(document.activeElement);
    return i < 0 ? 0 : i;
  }
  function go(el) {
    el.focus();
    if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }
  go(keys[0]);

  var buffer = '', timer = null;
  function clearBuffer() { buffer = ''; typed.innerHTML = '&nbsp;'; }
  function digit(d) {
    buffer = (buffer + d).slice(-2);
    typed.textContent = buffer;
    var n = parseInt(buffer, 10);
    if (byNum[n]) go(byNum[n]);
    else if (byNum[+d]) go(byNum[+d]);
    clearTimeout(timer);
    timer = setTimeout(clearBuffer, 1800);
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key, code = e.keyCode, i = current(), n = cols(), next = null, d = null;
    if (/^[0-9]$/.test(k)) d = k;
    else if (code >= 48 && code <= 57) d = String(code - 48);
    else if (code >= 96 && code <= 105) d = String(code - 96);
    if (d !== null) { digit(d); e.preventDefault(); return; }
    if (k === 'ArrowRight' || code === 39) next = i + 1;
    else if (k === 'ArrowLeft' || code === 37) next = i - 1;
    else if (k === 'ArrowDown' || code === 40) next = Math.min(i + n, keys.length - 1);
    else if (k === 'ArrowUp' || code === 38) next = i - n;
    if (next !== null) {
      if (next >= 0 && next < keys.length && next !== i) go(keys[next]);
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
